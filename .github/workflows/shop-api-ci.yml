name: Shop API CI
on:
  pull_request:
    branches:
      - main
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Install dependencies1
        run: npm install
        working-directory: GitHub/GitHubAction/Lending
      - name: Run lint
        run: npm run lint
        working-directory: GitHub/GitHubAction/Lending
      - name: Run tests
        run: npm test
        working-directory: GitHub/GitHubAction/Lending
      - name: Run build
        run: npm run build
        working-directory: GitHub/GitHubAction/Lending
